name: Atlas checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if(process.env.RELEASE_TAG !== "v"+JSON.parse(require("fs").readFileSync("package.json")).version)process.exit(1)'
      - run: node scripts/atlas-public-check.cjs --history
      - run: corepack enable && corepack prepare pnpm@8.15.9 --activate
      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: pnpm check
      - run: node scripts/atlas-package.cjs artifacts/releases/atlas-linux

      - name: Archive Linux client
        run: |
          tar -C artifacts/releases -czf artifacts/zhitu-atlas-linux-x64.tar.gz atlas-linux
          cd artifacts
          sha256sum zhitu-atlas-linux-x64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zhitu-atlas-linux-x64
          path: |
            artifacts/zhitu-atlas-linux-x64.tar.gz
            artifacts/SHA256SUMS
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zhitu-atlas-linux-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --generate-notes
